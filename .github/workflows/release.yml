# Pushing a tag vX.Y.Z (scripts/release.sh does it) publishes that version: the
# package to PyPI, the container image to ghcr.io, and a GitHub release carrying
# that version's CHANGELOG entry.
#
# No tokens. PyPI trusts this workflow through Trusted Publishing (OIDC), and
# the image is pushed with the automatic GITHUB_TOKEN. The one-time PyPI-side
# setup is in docs/releasing.md.
#
# The tag is the trigger, rather than a GitHub release, so that the release page
# is created by the same run that built the artifacts. There is no window in
# which a release exists but nothing was published.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  # Everything that can say "no" happens here, before anything is published.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # The tag is the only thing typed by hand during a release. A tag that
      # disagrees with pyproject.toml would publish a version nobody meant, or
      # be rejected by PyPI as a duplicate.
      - name: The tag matches pyproject.toml, and CHANGELOG.md has an entry
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          grep -qE "^version = \"${version}\"$" pyproject.toml \
            || { echo "::error::tag ${GITHUB_REF_NAME} does not match the version in pyproject.toml"; exit 1; }
          # The release notes are the CHANGELOG section, so a missing section is
          # a release with no notes -- worth failing over.
          awk -v v="$version" '
            $0 ~ "^## " v "( |$)" {on=1; next}
            on && /^## / {exit}
            on {print}' CHANGELOG.md | sed -e '/./,$!d' > notes.md
          test -s notes.md || { echo "::error::no '## ${version}' section in CHANGELOG.md"; exit 1; }
          echo "Release notes:"; cat notes.md

      - name: Lint and types
        run: |
          uv run ruff check
          uv run ruff format --check
          uv run mypy

      - name: Full suite, both backends, with the coverage gate
        run: uv run --extra api --extra client --extra postgres --group pg pytest --cov --cov-fail-under=75

      - name: Build the sdist and wheel
        run: uv build

      # Catches a README that PyPI will refuse to render, which is otherwise
      # only discovered after the upload has already succeeded.
      - name: Check the metadata renders
        run: uv run --no-project --with twine twine check dist/*

      # The suite runs against the source tree, so it cannot see a missing
      # package-data entry. Only installing the artifact can.
      - name: The built wheel actually works
        run: |
          set -euo pipefail
          uv venv /tmp/relcheck
          uv pip install --python /tmp/relcheck/bin/python dist/*.whl
          /tmp/relcheck/bin/chesssnake --help > /dev/null
          /tmp/relcheck/bin/python -c "
          import os
          from chesssnake import Game
          from chesssnake.assets import asset_path
          g = Game.local(white_name='a', black_name='b')
          g.move('e4')
          assert g.fen.startswith('rnbqkbnr/pppppppp/8/8/4P3'), g.fen
          for asset in ('img/template.png', 'img/blankboard.png', 'Roboto-Black.ttf', 'chesssnake.toml'):
              assert os.path.isfile(asset_path(asset)), f'{asset} is missing from the wheel'
          g.render()
          print('wheel ok')
          "
          # The web UI is nothing but package data: every file of it in the
          # source tree must be in the wheel, or the page loads with a 404 in it.
          /tmp/relcheck/bin/python -c "
          import os, sys
          from chesssnake.assets import asset_path
          src = 'src/chesssnake/data/web'
          wanted = {os.path.relpath(os.path.join(d, f), src) for d, _, fs in os.walk(src) for f in fs}
          missing = sorted(p for p in wanted if not os.path.isfile(asset_path('web/' + p)))
          assert wanted and not missing, f'web UI files missing from the wheel: {missing}'
          print(f'web ok: {len(wanted)} files')
          "

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes.md

  pypi:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/chesssnake/
    permissions:
      id-token: write # mint the OIDC token Trusted Publishing exchanges
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        # No `skip-existing`: re-publishing a version already on PyPI should
        # fail loudly, not succeed quietly and leave you thinking it shipped.

  image:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # arm64 is emulated, which is why this job gets a long timeout. It is
      # worth it: a Raspberry Pi or an Apple-silicon machine is a normal place
      # to run a small self-hosted game server.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/gabebecker2048/chesssnake # lowercase: image names must be
          # :0.9.2, :0.9 and :0 so a deployment can pin as tightly as it likes,
          # plus :latest.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/build/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Last, so the release page only appears once PyPI and the registry both have
  # the version. A release that exists while nothing was published is worse than
  # no release.
  github-release:
    needs: [pypi, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: notes
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "chesssnake ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag --latest
