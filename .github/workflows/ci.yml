name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # Uses the ruff version pinned in uv.lock for reproducibility.
      - name: Ruff lint
        run: uv run ruff check
      - name: Ruff format
        run: uv run ruff format --check
      - name: mypy (lenient)
        run: uv run mypy

  test:
    name: unit (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      # Unit tests only need the core package + pytest (no DB / server deps), so
      # run them lightweight across the whole supported version matrix.
      # --no-default-groups, not --no-dev: `pg` is a default group as well, and
      # its pgserver has no wheels beyond cp311/cp312.
      - name: Unit tests
        run: uv run --no-default-groups --with pytest --python ${{ matrix.python-version }} pytest tests/unit

  integration-sqlite:
    name: integration sqlite (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      CHESSSNAKE_TEST_BACKENDS: sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      # SQLite needs no driver, so the api extra must stay free of compiled
      # dependencies. This asserts the PostgreSQL driver really isn't pulled in.
      - name: The SQLite path has no compiled dependencies
        run: |
          uv run --no-default-groups --extra api --extra client --python ${{ matrix.python-version }} \
            python -c "import importlib.util, sys; sys.exit(any(importlib.util.find_spec(m) is not None for m in ('psycopg', 'psycopg2')))"
      # The `pg` group (pgserver) is deliberately omitted: it ships only
      # cp311/cp312 wheels, and the SQLite backend has no such constraint.
      - name: Integration and configuration tests (SQLite)
        run: uv run --no-group pg --extra api --extra client --python ${{ matrix.python-version }} pytest tests/integration tests/config

  integration-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # Spins up a throwaway Postgres via pgserver (the `pg` group), which only
      # publishes cp311/cp312 wheels -- hence no Python matrix here.
      - name: Integration and configuration tests (PostgreSQL and SQLite)
        run: uv run --extra api --extra client --extra postgres --group pg pytest tests/integration tests/config

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # Runs the whole suite (unit + integration) so the coverage number is
      # authoritative, and fails the build if it drops below the gate.
      - name: Tests with coverage gate
        run: uv run --extra api --extra client --extra postgres --group pg pytest --cov --cov-report=term-missing --cov-fail-under=75
  # A single check for branch protection to require, so the rule doesn't have to
  # name every job and matrix entry, and doesn't go stale when they change.
  all-green:
    needs: [lint, test, integration-sqlite, integration-postgres, coverage]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '${{ toJSON(needs) }}'
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.integration-sqlite.result }}" = "success"
          test "${{ needs.integration-postgres.result }}" = "success"
          test "${{ needs.coverage.result }}" = "success"
