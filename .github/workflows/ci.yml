name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # Uses the ruff version pinned in uv.lock for reproducibility.
      - name: Ruff lint
        run: uv run ruff check
      - name: Ruff format
        run: uv run ruff format --check
      - name: mypy (lenient)
        run: uv run mypy

  test:
    name: unit (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      # Unit tests only need the core package + pytest (no DB / server deps),
      # so run them lightweight across the whole supported version matrix.
      - name: Unit tests
        run: uv run --no-dev --with pytest --python ${{ matrix.python-version }} pytest tests/unit

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # Integration tests spin up a throwaway Postgres via pgserver (dev group)
      # and exercise the api-endpoint + remote client (api/client extras).
      - name: Integration tests
        run: uv run --extra api --extra client pytest tests/integration

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # Runs the whole suite (unit + integration) so the coverage number is
      # authoritative, and fails the build if it drops below the gate.
      - name: Tests with coverage gate
        run: uv run --extra api --extra client pytest --cov --cov-report=term-missing --cov-fail-under=75