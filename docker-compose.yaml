# A local PostgreSQL for an api-endpoint you run from source (`uv run chesssnake
# api-endpoint`). This is the development database only -- it does not run
# chesssnake itself.
#
# To run the whole stack in containers instead, see docker/:
#   docker compose -f docker/compose.sqlite.yaml   up --build   # no server at all
#   docker compose -f docker/compose.postgres.yaml up --build   # api + postgres
#
# Create the schema with `chesssnake init-db` (or `api-endpoint --init-db`);
# since 0.9.0 it is built from the SQLAlchemy metadata rather than a bundled
# .sql file. Note the host port is 5433, so it must be explicit in the URL:
#
#   export CHESSSNAKE__DATABASE__URL=postgresql://chesssnake@localhost:5433/chesssnake
#   chesssnake api-endpoint
#
# or put the same value under [database] url in chesssnake.toml.
services:
  postgresDB:
    image: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chesssnake}
      POSTGRES_USER: ${POSTGRES_USER:-chesssnake}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - ./postgres-db:/var/lib/postgresql/data
