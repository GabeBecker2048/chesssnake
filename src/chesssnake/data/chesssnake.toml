#: chesssnake configuration
#:
#: Created by `chesssnake config init`. Every value below is the built-in default,
#: so deleting a line changes nothing — it just falls back to the same value.
#: Settings with no default are commented out; uncomment and fill them in.
#:
#: ---------------------------------------------------------------------------
#: Precedence
#: ---------------------------------------------------------------------------
#: Each setting can come from four places. Later ones win:
#:
#:   1. this file
#:   2. an environment variable
#:   3. a command-line flag
#:   0. (lowest) the built-in default, used when nothing else sets it
#:
#: Environment variable names are derived mechanically from the setting's
#: position in this file: CHESSSNAKE__<SECTION>__<KEY>, uppercased, with a
#: DOUBLE underscore before the section and before the key. So `[api] port`
#: below is always CHESSSNAKE__API__PORT, and `[database] pool_max_size` is
#: CHESSSNAKE__DATABASE__POOL_MAX_SIZE.
#:
#: Any setting can also be overridden on the command line with -o/--set:
#:   chesssnake api-endpoint -o database.pool_max_size=20
#:
#: To see what is actually in effect and which layer each value came from:
#:   chesssnake config show
#:
#: ---------------------------------------------------------------------------
#: Where this file is read from
#: ---------------------------------------------------------------------------
#: The first of these that exists is used:
#:
#:   1. the path given to --config
#:   2. the path in the CHESSSNAKE_CONFIG environment variable
#:   3. ./chesssnake.toml (the working directory)
#:   4. $CHESSSNAKE_HOME/chesssnake.toml
#:   5. ~/.config/chesssnake/chesssnake.toml
#:
#: Having no config file at all is fine; the defaults stand on their own.
#: (Note CHESSSNAKE_CONFIG and CHESSSNAKE_HOME use a SINGLE underscore. They are
#: read before this file is located, so they are not settings themselves.)
#:
#: Unknown keys are rejected at startup rather than ignored, so a typo here is
#: an error you will see immediately instead of a setting that silently does
#: nothing.


#: ===========================================================================
#: [api] — the api-endpoint HTTP server
#: ===========================================================================
[api]

#: Address the server binds to.
#: Use "127.0.0.1" to accept only local connections, or "0.0.0.0" to accept
#: connections from anywhere (what you usually want inside a container).
#: Values: any IP address or hostname the machine can bind. Default "127.0.0.1".
host = "127.0.0.1"

#: TCP port the server listens on.
#: Values: 1-65535. Ports below 1024 need elevated privileges. Default 8000.
port = 8000

#: Who can create an account.
#:   "closed": only administrators create users (over the API, or with
#:             `chesssnake user create` on the server's machine).
#:   "open":   anyone who can reach the server can POST /v1/auth/register.
#: Every /v1 route except logging in and registering needs a login either way;
#: GET /health is always open, so load balancers can probe it. Make the first
#: administrator with `chesssnake user create NAME --admin`.
#: Values: "closed", "open". Default "closed".
registration = "closed"

#: How long a login lasts before the user has to log in again. Named api tokens
#: (for scripts and bots) set their own expiry, or none.
#: Values: 1-3650 days. Default 30.
session_lifetime_days = 30


#: ===========================================================================
#: [database] — where games are stored
#: ===========================================================================
[database]

#: Database connection string. This is the one setting with no usable default:
#: the api-endpoint cannot start without it.
#:
#: The URL scheme selects the backend.
#:
#: SQLite — a single file, no server, and no compiled dependencies. Good for a
#: single api-endpoint process serving many clients. Note the number of slashes:
#: three for a relative path, four for an absolute one.
#:   url = "sqlite:///chesssnake.db"            # relative to the working directory
#:   url = "sqlite:////var/lib/chesssnake/chesssnake.db"   # absolute
#:
#: PostgreSQL — needs a server and the `postgres` extra
#: (pip install 'chesssnake[api,postgres]'). Use this for multiple worker
#: processes, or when the database lives on another host.
#:   url = "postgresql://user:password@localhost:5432/chesssnake"
#:   url = "postgresql://user@localhost:5432/chesssnake?sslmode=require"
#:
#: For the bundled docker-compose Postgres (published on host port 5433):
#:   url = "postgresql://chesssnake@localhost:5433/chesssnake"
#:
#: Because this may contain a password, consider setting it through the
#: environment instead: CHESSSNAKE__DATABASE__URL='postgresql://...'
#: `chesssnake config show` prints this with the password redacted.
#:
#: Values: a database URL. libpq keyword strings ("dbname=... user=...") are not
#: accepted. No default (unset).
# url = "sqlite:///chesssnake.db"

#: Number of connections opened to the database when the pool is created.
#: Values: integer >= 1, and no greater than pool_max_size. Default 1.
pool_min_size = 1

#: Ceiling on simultaneous database connections held by this process.
#: Raise it if you run many concurrent requests; keep it comfortably under the
#: server's own `max_connections`, especially when running multiple workers,
#: since each worker keeps its own pool.
#: Values: integer >= 1, and no less than pool_min_size. Default 10.
pool_max_size = 10

#: Create the database schema when the api-endpoint starts. Only missing tables
#: are created and existing ones are never altered, so leaving this on is safe,
#: but it costs a connection and a few statements on every boot. It also means a
#: release that changes the schema needs `chesssnake init-db --drop` first.
#:
#: Equivalent to passing --init-db. To create the schema once and exit instead,
#: run `chesssnake init-db` (which also takes --create-database to create the
#: database itself, given sufficient permissions).
#: Values: true, false. Default false.
init_schema = false

#: How long a blocked SQLite writer waits for the database lock before giving up
#: with "database is locked". SQLite serializes writers, so under concurrent play
#: a request may briefly wait its turn; raise this if you see lock errors under
#: load. Ignored on PostgreSQL, which locks per row instead.
#: Values: integer milliseconds >= 0. Default 5000 (five seconds).
sqlite_busy_timeout = 5000


#: ===========================================================================
#: [websocket] - real-time updates at /v1/ws (off by default)
#: ===========================================================================
#: With this on, a client can hold one websocket open and be told the moment a
#: game it follows changes, instead of polling. `chesssnake play` uses it when
#: the server offers it. It is served on the same host and port as everything
#: else, so there is nothing new to expose; a reverse proxy has to pass websocket
#: upgrades through (Caddy does by default, nginx needs the Upgrade headers).
#: The protocol is in docs/realtime-websockets.md. REST clients are unaffected
#: either way.
#:
#: Updates are delivered within one api-endpoint process. Running several
#: workers or replicas, a socket only hears of changes made through its own.
[websocket]

#: Serve /v1/ws at all. Off, the upgrade is refused (HTTP 403) and clients poll.
#: Values: true, false. Default false.
enabled = false

#: Open websockets allowed in total, counted from the moment one is accepted
#: (before it has authenticated). Each idle socket costs a little memory.
#: Values: integer >= 1. Default 1000.
max_connections = 1000

#: Of those, how many may be connected but not yet authenticated. This is what
#: stops anonymous connections from holding every slot.
#: Values: integer >= 1, and no greater than max_connections. Default 100.
max_pending_auth = 100

#: Open websockets allowed per user (a browser tab, a terminal, a phone...).
#: Values: integer >= 1, and no greater than max_connections. Default 10.
max_connections_per_user = 10

#: Games one websocket may follow at once.
#: Values: integer >= 1. Default 64.
max_subscriptions = 64

#: Seconds a new websocket has to send its token before it is closed (4408).
#: Values: number > 0. Default 10.
auth_timeout_seconds = 10.0

#: How often an open websocket's token is checked again, with +/-10% jitter.
#: Logging out, revoking a token, a password reset and disabling a user close
#: the affected sockets at once anyway; this is the backstop for anything else
#: that removes a token, such as `chesssnake user` run on the server's machine.
#: Values: number > 0. Default 60.
reauth_interval_seconds = 60.0

#: Messages buffered per websocket. A socket whose buffer fills is closed (1013)
#: and the client reconnects; a client that simply stops reading is caught by
#: the ping timeout below instead.
#: Values: integer >= 1. Default 256.
send_queue_size = 256

#: Seconds between protocol-level pings. They keep proxies and NAT from idling a
#: quiet socket out, and find dead peers. 0 disables them.
#: Values: number >= 0. Default 20.
ping_interval_seconds = 20.0

#: Close a websocket whose ping goes unanswered for this long.
#: Values: number >= 1. Default 20.
ping_timeout_seconds = 20.0

#: Largest message accepted from a client. Clients only ever send small control
#: messages, so this mostly bounds what a misbehaving one can make the server read.
#: Values: integer bytes >= 1024. Default 65536.
max_message_bytes = 65536

#: permessage-deflate compression. Messages are a few hundred bytes, so it saves
#: little, and it costs tens of kilobytes of memory per socket.
#: Values: true, false. Default false.
compression = false

#: Threads for the websocket side's database work (checking tokens, reading the
#: snapshot sent on subscribe). Kept apart from the REST routes' threads, so a
#: burst of reconnects cannot slow ordinary requests down.
#: Values: integer >= 1. Default 4.
worker_threads = 4

#: When the server shuts down, how long open connections get before they are cut
#: off. Keeps `docker stop` from waiting for its own kill timeout.
#: Values: number > 0. Default 5.
shutdown_timeout_seconds = 5.0

#: Browser origins allowed to connect, e.g. ["https://chess.example"]. Browsers
#: send an Origin header; anything else (chesssnake play, a bot) sends none and is
#: always allowed, since the token is what really guards a socket. Restrict this
#: when a web frontend is served from a known address. Entries are compared
#: without case or a trailing slash. In the environment, separate them with
#: commas: CHESSSNAKE__WEBSOCKET__ALLOWED_ORIGINS=https://a.example,https://b.example
#: Values: a list of origins, or ["*"] for any. Default ["*"].
allowed_origins = ["*"]


#: ===========================================================================
#: [web] — the browser frontend at /
#: ===========================================================================
[web]

#: Serve the web UI at / (the page, its scripts under /assets, and the piece
#: images). It talks only to the /v1 routes, logged in like any other client.
#: With [websocket] enabled it updates live; without, it polls every few seconds.
#: Turn it off for a server that only bots and scripts use.
#: Values: true, false. Default true.
enabled = true


#: ===========================================================================
#: [client] — intentionally absent
#: ===========================================================================
#: Remote Game clients read only the environment, never this file:
#:
#:   CHESSSNAKE__CLIENT__API_URL=http://localhost:8000
#:   CHESSSNAKE__CLIENT__TOKEN=css_...     (or log in once with `chesssnake login`)
#:
#: A library that read ./chesssnake.toml out of whatever directory the calling
#: program happened to start in would be surprising, so it does not. Adding a
#: [client] table here is an error rather than a value that would be silently
#: ignored — see `chesssnake config show`, which reports where each value came
#: from and would otherwise be lying to you.
