[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chesssnake"
version = "0.9.0"
description = "A robust Chess API and backend"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gabe Becker", email = "gabebecker2048@gmail.com" }]
dependencies = ["pillow>=11.3"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/GabeBecker2048/chesssnake"

[project.scripts]
chesssnake = "chesssnake.cli:main"

[project.optional-dependencies]
# For playing remote games (Game(remote=True)) against a chesssnake api-endpoint.
client = ["requests>=2.31"]
# For running the api-endpoint server. Works on SQLite with no compiled dependencies;
# add the `postgres` extra for a PostgreSQL backend.
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.0", "sqlalchemy>=2.0"]
# The PostgreSQL driver. Only needed for postgresql:// database URLs.
postgres = ["psycopg2-binary>=2.9"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["chesssnake*"]

[tool.setuptools.package-data]
chesssnake = ["data/*.toml", "data/*.ttf", "data/img/*.png", "py.typed"]

[dependency-groups]
dev = [
    "sqlalchemy>=2.0",
    "pytest>=9.1.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "requests>=2.31",
    "httpx>=0.27",
    "ruff>=0.9",
    "mypy>=1.8",
    "pytest-cov>=5.0",
    "pre-commit>=3.5",
]
# The PostgreSQL test stack. Split out of `dev` because pgserver publishes only
# cp311/cp312 wheels, which would otherwise pin the whole test suite to those
# interpreters -- the SQLite backend has no such constraint and is tested across
# the full supported matrix.
pg = [
    "pgserver>=0.1.4",
    "psycopg2-binary>=2.9.12",
]

[tool.uv]
# Install the PostgreSQL test stack by default. Without this a bare `uv run
# pytest` quietly drops pgserver and skips every PostgreSQL test while still
# reporting green -- the worst kind of passing build. CI's SQLite matrix job
# opts out with --no-group pg, since pgserver has no wheels beyond cp311/cp312.
default-groups = ["dev", "pg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that need the DB/API stack (deselect with -m 'not integration')",
]

[tool.coverage.run]
source = ["chesssnake"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# A pragmatic starter set: pyflakes (F), pycodestyle (E/W), import sorting (I),
# and pyupgrade (UP). Stricter rule families (bugbear, complexity, etc.) can be
# layered on in later refactor phases.
select = ["E", "F", "W", "I", "UP"]
# Line length is enforced by the formatter for code; don't also flag long
# docstrings/comments, which are plentiful in the engine.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests intentionally compare with `== None` to exercise Square.__eq__ (E711),
# and use `pytest.importorskip(...)` before importing optional deps (E402).
"tests/**" = ["E711", "E402"]
# UP042 wants `Termination(str, Enum)` rewritten as a StrEnum now that 3.11 is the
# floor. That changes `str(member)` from "Termination.X" to "x", which is a
# behavioral change to a serialized value — worth doing deliberately, not as
# lint fallout from a version bump.
"src/chesssnake/engine/enums.py" = ["UP042"]

[tool.mypy]
# Lenient starting point (per the refactor plan): type-check the package without
# requiring every function to be annotated yet. Tighten in later phases.
files = ["src/chesssnake"]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
