[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chesssnake"
version = "0.7.0"
description = "A robust Chess API and backend"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gabe Becker", email = "gabebecker2048@gmail.com" }]
dependencies = ["pillow>=11.3"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/GabeBecker2048/chesssnake"

[project.scripts]
chesssnake = "chesssnake.cli:main"

[project.optional-dependencies]
# For playing remote games (Game(remote=True)) against a chesssnake api-endpoint.
client = ["requests>=2.31"]
# For running the api-endpoint server (`chesssnake api-endpoint`).
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "psycopg2-binary>=2.9"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["chesssnake*"]

[tool.setuptools.package-data]
chesssnake = ["data/*.sql", "data/*.ttf", "data/img/*.png", "py.typed"]

[dependency-groups]
dev = [
    "pgserver>=0.1.4",
    "psycopg2-binary>=2.9.12",
    "pytest>=9.1.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "requests>=2.31",
    "httpx>=0.27",
    "ruff>=0.9",
    "mypy>=1.8",
    "pytest-cov>=5.0",
    "pre-commit>=3.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that need the DB/API stack (deselect with -m 'not integration')",
]

[tool.coverage.run]
source = ["chesssnake"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# A pragmatic starter set: pyflakes (F), pycodestyle (E/W), import sorting (I),
# and pyupgrade (UP). Stricter rule families (bugbear, complexity, etc.) can be
# layered on in later refactor phases.
select = ["E", "F", "W", "I", "UP"]
# Line length is enforced by the formatter for code; don't also flag long
# docstrings/comments, which are plentiful in the engine.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests intentionally compare with `== None` to exercise Square.__eq__ (E711),
# and use `pytest.importorskip(...)` before importing optional deps (E402).
"tests/**" = ["E711", "E402"]

[tool.mypy]
# Lenient starting point (per the refactor plan): type-check the package without
# requiring every function to be annotated yet. Tighten in later phases.
files = ["src/chesssnake"]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
